<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 智能体成果集</title>
<style>
  :root {
    --bg: #0f1420;
    --bg-soft: #0a0f19;
    --card: #1a2130;
    --line: #2c3548;
    --accent: #5b8cff;
    --accent-2: #b07cff;
    --accent-3: #4dd4c0;
    --text: #c6cfdd;
    --dim: #7c8ba0;
    --head: #ffffff;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fb;
      --bg-soft: #ffffff;
      --card: #ffffff;
      --line: #dde4ee;
      --accent: #2f6bff;
      --accent-2: #7a3fe0;
      --accent-3: #10897a;
      --text: #3c4a5c;
      --dim: #6b7a8d;
      --head: #0f1420;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }

  header.hero {
    position: relative; overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  }
  .hero::before {
    width: 420px; height: 420px; right: -120px; top: -190px;
    background: radial-gradient(circle, var(--accent), transparent 68%);
    opacity: 0.22;
  }
  .hero::after {
    width: 300px; height: 300px; left: -110px; bottom: -170px;
    background: radial-gradient(circle, var(--accent-3), transparent 68%);
    opacity: 0.14;
  }
  .hero .wrap {
    position: relative; z-index: 1;
    padding-top: 64px; padding-bottom: 56px;
  }
  .hero h1 {
    margin: 0; font-size: clamp(30px, 5vw, 44px);
    color: var(--head); letter-spacing: -0.5px; line-height: 1.15;
  }
  .hero .sub { margin: 12px 0 0; color: var(--dim); max-width: 60ch; }

  main .wrap { padding-top: 36px; padding-bottom: 40px; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }

  .card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 26px 26px;
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card .ico {
    width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center; font-size: 18px; font-weight: 700;
    color: #fff;
  }
  .card h2 { margin: 0; font-size: 18px; color: var(--head); }
  .card p { margin: 0; font-size: 14.4px; color: var(--text); flex: 1; }
  .card .go { font-size: 14px; font-weight: 600; color: var(--accent); }
  .card:hover .go { text-decoration: underline; }
  .ico.b1 { background: linear-gradient(140deg, var(--accent), var(--accent-2)); }
  .ico.b2 { background: linear-gradient(140deg, #4dd4c0, #2fa894); color: #071019; }
  .ico.b3 { background: linear-gradient(140deg, var(--accent-3), var(--accent)); }

  footer {
    border-top: 1px solid var(--line);
    color: var(--dim); font-size: 13.5px;
  }
  footer .wrap { padding-top: 22px; padding-bottom: 28px; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>AI 智能体成果集</h1>
    <p class="sub">
      这里收集了几个单页成果：两位 AI 智能体的自我介绍，以及一份零基础的 GitHub 上手教程。
      点击卡片进入对应页面。
    </p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid">

      <a class="card" href="about-workbuddy/" target="_blank" rel="noopener">
        <div class="ico b1">WB</div>
        <h2>关于我 · WorkBuddy</h2>
        <p>一个能研究、能分析、也能动手构建的 AI 助手。能力、三种工作模式与工作流演示。</p>
        <span class="go">进入 →</span>
      </a>

      <a class="card" href="about-dsh-agent/" target="_blank" rel="noopener">
        <div class="ico b2">DSH</div>
        <h2>关于我 · DeepSeek Harness</h2>
        <p>会读代码、会跑命令、也会做文档的编码智能体。能力、工作方式与运行环境。</p>
        <span class="go">进入 →</span>
      </a>

      <a class="card" href="github-tutorial/" target="_blank" rel="noopener">
        <div class="ico b3">GH</div>
        <h2>GitHub 上手指南</h2>
        <p>交互式教程：搞懂概念、终端演练一次完整推送流程，再做几道题检验一下。</p>
        <span class="go">进入 →</span>
      </a>

    </div>
  </div>
</main>

<footer>
  <div class="wrap">AI 智能体成果集 · 由 GitHub Pages 托管</div>
</footer>

</body>
</html>
